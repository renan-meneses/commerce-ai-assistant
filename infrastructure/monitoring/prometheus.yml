# Prometheus scrape config — one target per service.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]

  - job_name: ai-service
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
