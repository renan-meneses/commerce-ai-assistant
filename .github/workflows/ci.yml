name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (NestJS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: commerce
          RABBITMQ_DEFAULT_PASS: commerce_dev_password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    env:
      DATABASE_URL: postgresql://commerce:commerce_dev_password@localhost:5432/commerce?schema=public
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://commerce:commerce_dev_password@localhost:5672
      JWT_SECRET: ci-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/api/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Prisma generate
        run: yarn prisma generate

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Build
        run: yarn build

      - name: Migrate
        run: yarn prisma migrate deploy

      - name: Seed
        run: yarn prisma db seed

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        run: yarn test:e2e

  ai-service:
    name: AI service (FastAPI + LangGraph)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    defaults:
      run:
        working-directory: apps/ai-service

    env:
      DATABASE_URL: postgresql://commerce:commerce_dev_password@localhost:5432/commerce
      REDIS_URL: redis://localhost:6379/0
      EMBEDDINGS_USE_HASH: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check app tests

      - name: Format check
        run: .venv/bin/ruff format --check app tests

      - name: Typecheck
        run: .venv/bin/mypy app

      - name: Unit tests
        run: .venv/bin/python -m pytest tests/ -q
