name: AI Evaluation

# Runs the retrieval + behavioral evaluation suites on every push to main
# and on demand, using a fresh pgvector database and deterministic hash
# embeddings (no external LLM/API keys required).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: commerce
          POSTGRES_USER: commerce
          POSTGRES_PASSWORD: commerce_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U commerce -d commerce"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: commerce
          RABBITMQ_DEFAULT_PASS: commerce_dev_password
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://commerce:commerce_dev_password@localhost:5432/commerce
      REDIS_URL: redis://localhost:6379/0
      RABBITMQ_URL: amqp://commerce:commerce_dev_password@localhost:5672
      EMBEDDINGS_USE_HASH: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/ai-service/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/api/yarn.lock

      - name: Install AI service
        working-directory: apps/ai-service
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Install API
        working-directory: apps/api
        run: yarn install --frozen-lockfile --non-interactive

      - name: Migrate + seed API database
        working-directory: apps/api
        run: |
          yarn prisma generate
          yarn prisma migrate deploy
          yarn prisma db seed

      - name: Boot API
        working-directory: apps/api
        env:
          JWT_SECRET: ci-secret
        run: |
          yarn start:prod > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/v1/health

      - name: Index catalog (hash embeddings)
        working-directory: apps/ai-service
        run: .venv/bin/python -m app.indexing.cli --reindex-all

      - name: Run evaluation suites
        working-directory: apps/ai-service
        run: |
          .venv/bin/python -m app.evaluation.cli --suite rag
          .venv/bin/python -m app.evaluation.cli --suite agent

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: evaluation/reports/
          if-no-files-found: error
